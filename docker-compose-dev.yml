services:
  frontend:
    image: node:10.15.3
    working_dir: /app
    init: true
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      BROWSER: none
      CHOKIDAR_USEPOLLING: "true"
    env_file:
      - .env
    volumes:
      - .:/app
      - portal_uniforme_frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm start"

volumes:
  portal_uniforme_frontend_node_modules:
